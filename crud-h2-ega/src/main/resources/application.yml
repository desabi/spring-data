spring:
  application:
  name: crud-h2-ega
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:crudh2
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    spring:
      jpa:
        database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true